default:
  tags:
    - docker

stages:
  - build
  - test

variables:
  DEBIAN_FRONTEND: noninteractive
  BUILD_DIR: build

# ------------------------------------------------------------
# Shared setup for Debian Trixie jobs
# ------------------------------------------------------------
.before_debian_trixie: &before_debian_trixie
  before_script:
    - apt-get update -y
    - apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config git ca-certificates ruby
    - git config --global advice.detachedHead false

# ------------------------------------------------------------
# BUILD JOB
# ------------------------------------------------------------
build:
  stage: build
  image: debian:trixie
  <<: *before_debian_trixie
  script:
    - cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
    - cmake --build build --target all
  artifacts:
    paths:
      - build/fairlanes
      - build/fairlanes_tests
    expire_in: 1 week

# ------------------------------------------------------------
# TEST JOB
# ------------------------------------------------------------
test:
  stage: test
  image: debian:trixie
  needs:
    - job: build
      artifacts: true
  script:
    - ./build/fairlanes_tests
